plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Lets TACZ's own mixins (compiled against SRG names) apply in the dev environment
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    // Downloads TACZ straight from CurseForge, no manual jar needed
    // (Not exclusiveContent: ForgeGradle serves the remapped TACZ jar from its own local repo
    //  under the same curse.maven group, so that repo must be allowed to provide it too.)
    maven {
        url 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("curse.maven:timeless-and-classics-zero-1028108:${tacz_file_id}")

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:${mixinextras_version}")) {
        jarJar.ranged(it, "[${mixinextras_version},)")
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand replaceProperties }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'   : mod_id,
            'Specification-Vendor'  : mod_authors,
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor' : mod_authors,
            'MixinConfigs'          : "${mod_id}.mixins.json"
        ])
    }
    finalizedBy 'reobfJar'
}

jarJar.enable()
tasks.named('jarJar').configure { archiveClassifier = '' }
tasks.named('jar').configure { archiveClassifier = 'slim' }
reobf { jarJar {} }
tasks.jarJar.finalizedBy('reobfJarJar')

// ForgeGradle always builds a "-slim" jar (the mod without MixinExtras bundled) on the way to the
// real one. It's only an intermediate file, so remove it to leave just the jar you should install.
tasks.named('build').configure {
    doLast {
        delete fileTree(dir: layout.buildDirectory.dir('libs').get().asFile, include: '*-slim.jar')
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
